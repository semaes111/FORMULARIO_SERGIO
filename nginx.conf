server {
    listen 80;
    server_name _;
    root /app;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ─── Static assets exactos: sirven con cache 7d, sin spam de logs ────
    # Si en el futuro se borra un asset, devolvemos 404 silencioso (no
    # contaminar logs ni hacer fallback al index.html como si fuera el HTML).

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon-32x32.png {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 1d;
    }

    # Apple touch icons (con y sin -precomposed, con y sin sufijo de tamaño)
    location ~* ^/apple-touch-icon.*\.png$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ─── HTML: prohibida la caché heurística ─────────────────────────────
    # Sin Cache-Control, los navegadores cachean el HTML por heurística
    # (RFC 9111 §4.2.2) y algunos dispositivos siguen ejecutando JS antiguo
    # tras un deploy → "funciona en unos ordenadores/móviles y en otros no".
    # expires -1 emite "Cache-Control: no-cache" (revalidar siempre; 304 si
    # no cambió) sin usar add_header, así NO se anula la herencia de las
    # cabeceras de seguridad del bloque server.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Atajo /admin → /admin.html (URL canónica del panel del doctor).
    # location = (exact match) tiene precedencia sobre el prefix location
    # /admin de abajo, así que /admin se redirige y /admin.html sigue
    # sirviéndose directo por el bloque prefix.
    # 302 (temporal) en lugar de 301 para mantener flexibilidad futura
    # si la URL canónica del panel cambia.
    location = /admin {
        return 302 /admin.html;
    }

    location /admin {
        try_files /admin.html =404;
        expires -1;
    }

    # Health-check endpoint usado por Dokploy/Traefik.
    # location = (exact match) → máxima precedencia, no depende de try_files
    # ni del orden de evaluación de regex. access_log off para no spamear
    # los logs con los probes periódicos del orquestador.
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
    }
}
