server {
    listen 80;
    server_name _;
    root /app;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ─── Static assets exactos: sirven con cache 7d, sin spam de logs ────
    # Si en el futuro se borra un asset, devolvemos 404 silencioso (no
    # contaminar logs ni hacer fallback al index.html como si fuera el HTML).

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon-32x32.png {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 1d;
    }

    # Apple touch icons (con y sin -precomposed, con y sin sufijo de tamaño)
    location ~* ^/apple-touch-icon.*\.png$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin {
        try_files /admin.html =404;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
    }
}
