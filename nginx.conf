server {
    listen 80;
    server_name _;
    root /app;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ─── Assets estáticos: cache 7d, sin spam de logs, 404 silencioso ────
    # expires 7d ya emite "Cache-Control: max-age=604800"; al no usar
    # add_header aquí, estas locations heredan además las cabeceras de
    # seguridad del bloque server.
    location ~* ^/(favicon.*|apple-touch-icon.*\.png|robots\.txt)$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    # ─── HTML: prohibida la caché heurística ─────────────────────────────
    # Sin Cache-Control, los navegadores cachean el HTML por heurística
    # (RFC 9111 §4.2.2) y algunos dispositivos siguen ejecutando JS antiguo
    # tras un deploy → "funciona en unos ordenadores/móviles y en otros no".
    # expires -1 emite "Cache-Control: no-cache" (revalidar siempre; 304 si
    # no cambió) sin usar add_header, así NO se anula la herencia de las
    # cabeceras de seguridad del bloque server.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Panel del doctor: /admin y /admin.html sirven el mismo HTML directo
    # (sin redirect 302: un round-trip menos).
    location /admin {
        try_files /admin.html =404;
        expires -1;
    }

    # Health-check endpoint usado por Dokploy/Traefik.
    # location = (exact match) → máxima precedencia. access_log off para no
    # spamear los logs con los probes periódicos del orquestador.
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
    }
}
